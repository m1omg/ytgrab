name: build

on:
  push:
    tags: ["v*"]
    # A new version merged into main releases itself, as does a change to
    # this workflow while that version isn't out yet.
    branches: [main]
    paths: ["ytgrab/__init__.py", ".github/workflows/build.yml"]
  workflow_dispatch:   # lets you build from the Actions tab any time
    inputs:
      version:
        description: "Tag to create and release, e.g. v1.0.7. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write      # needed to attach binaries to a release

# One run at a time per branch, so two quick merges can't both release.
concurrency:
  group: build-${{ github.ref }}

jobs:
  # The release's tag, checked before anything is built: a typo would only
  # show once every build had run and the release could not be published.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref_type == 'branch'
      - id: tag
        env:
          INPUT: ${{ github.event.inputs.version || (github.ref_type == 'tag' && github.ref_name) || '' }}
          MERGED: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        run: |
          build=true
          # A push to main releases the version in ytgrab/__init__.py, once:
          # a tag for it means it is already out, and nothing gets built.
          if [ "$MERGED" = true ]; then
            INPUT=v$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' ytgrab/__init__.py)
            if git ls-remote --exit-code --tags origin "refs/tags/$INPUT" > /dev/null; then
              echo "$INPUT is already released."
              INPUT= build=false
            fi
          fi
          # Stray spaces or a full stop copied along with the version don't
          # count, and "1.3.0" means v1.3.0.
          tag=$(printf '%s' "$INPUT" | tr -d '[:space:]' | sed 's/[.]*$//')
          if [ -n "$tag" ]; then
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+(\.[0-9]+){1,3}$'; then
              echo "::error::\"$INPUT\" is not a version - type it like v1.3.0."
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional || false }}
    timeout-minutes: 40    # fail rather than queue forever if runners are scarce
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux binary carries the build machine's own libraries (glib,
          # for one), which only run where glibc is at least as new as there.
          # ubuntu-latest moved to 26.04 (glibc 2.43) and broke 1.4.1 on
          # Debian 13 (2.41), so the image is pinned and the build fails if
          # anything bundled needs more than max-glibc.
          - os: ubuntu-24.04
            name: linux-x86_64
            artifact: DLPizer-linux-x86_64
            qjs: linux-x86_64
            max-glibc: "2.39"
          - os: windows-latest
            name: windows-x86_64
            artifact: DLPizer-windows-x86_64.exe
            qjs: windows-x86_64
          - os: macos-latest
            name: macos-arm64
            artifact: DLPizer-macos-arm64.zip
            python-arch: arm64
            # Qt 6.10+ needs macOS 15; 6.9.3 still supports macOS 12.
            pyside: PySide6-Essentials==6.9.3
            ffmpeg-tag: macosx_11_0_arm64
            qjs: darwin-arm64
          # Intel build runs on an Apple Silicon runner via Rosetta, because
          # the macos-13 Intel runners are being retired. Rosetta translates
          # x86_64 -> arm64, so an arm64 host can run the x64 toolchain.
          - os: macos-latest
            name: macos-x86_64
            artifact: DLPizer-macos-x86_64.zip
            python-arch: x64
            target-arch: x86_64
            pyside: PySide6-Essentials==6.9.3
            ffmpeg-tag: macosx_10_9_x86_64
            qjs: darwin-x86_64
            optional: true      # never block a release on this leg

    steps:
      - uses: actions/checkout@v4

      # Rosetta lets the arm64 runner execute the x86_64 Python toolchain.
      - name: Ensure Rosetta (macOS Intel build)
        if: matrix.python-arch == 'x64' && runner.os == 'macOS'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch || 'x64' }}

      # PySide6 needs these shared libraries to even start headless on Linux.
      - name: Install Linux Qt runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Older Macs cannot run the newest Qt: 6.10+ is built against the
      # macOS 15 SDK, so the app would die on launch on anything older.
      - name: Pin Qt for macOS compatibility
        if: runner.os == 'macOS' && matrix.pyside != ''
        run: pip install "${{ matrix.pyside }}"

      # pip resolves wheels for the host, so the Intel build would otherwise
      # bundle an arm64 ffmpeg that cannot run on a real Intel Mac.
      - name: Fetch ffmpeg for the target architecture (macOS)
        if: runner.os == 'macOS'
        run: |
          FF=$(python packaging/fetch_ffmpeg.py "${{ matrix.ffmpeg-tag }}" ffbin)
          echo "YTGRAB_FFMPEG=$FF" >> "$GITHUB_ENV"
          echo "bundling: $FF"
          lipo -archs "$FF"
          case "${{ matrix.name }}" in
            *x86_64) lipo -archs "$FF" | grep -q x86_64 || { echo "ffmpeg is not x86_64"; exit 1; } ;;
            *arm64)  lipo -archs "$FF" | grep -q arm64  || { echo "ffmpeg is not arm64";  exit 1; } ;;
          esac

      # pip resolves wheels for the host, so the Rosetta build would otherwise
      # pull arm64 C extensions. universal2 wheels carry both architectures and
      # PyInstaller can thin them to the target.
      - name: Reinstall compiled deps as universal2 (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          pip install --force-reinstall --no-deps --only-binary=:all: \
            --platform macosx_10_13_universal2 \
            --platform macosx_10_15_universal2 \
            --platform macosx_11_0_universal2 \
            --target universal-deps \
            websockets brotli pycryptodomex || echo "universal2 wheels unavailable"
          if [ -d universal-deps ]; then
            SITE=$(python -c "import site; print(site.getsitepackages()[0])")
            cp -R universal-deps/* "$SITE"/ 2>/dev/null || true
          fi

      # yt-dlp needs a JavaScript runtime to solve YouTube's challenges, and
      # QuickJS is small enough to ship in every build. As with ffmpeg, the
      # target picks the binary, not the host.
      - name: Fetch QuickJS for the target platform
        shell: bash
        run: |
          QJS=$(python packaging/fetch_qjs.py "${{ matrix.qjs }}" qjsbin)
          echo "YTGRAB_QJS=$QJS" >> "$GITHUB_ENV"
          echo "bundling: $QJS"

      - name: Build
        env:
          YTGRAB_TARGET_ARCH: ${{ matrix.target-arch || '' }}
          YTGRAB_MAX_GLIBC: ${{ matrix.max-glibc || '' }}
        run: pyinstaller --noconfirm --clean ytgrab.spec

      # Prove the binary actually runs and found a working ffmpeg, rather than
      # just shipping whatever PyInstaller produced.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/DLPizer --selftest

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\dist\DLPizer.exe --selftest

      - name: Package (Linux)
        if: matrix.name == 'linux-x86_64'
        run: mv dist/DLPizer "${{ matrix.artifact }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: mv dist/DLPizer.exe "${{ matrix.artifact }}"

      - name: Ad-hoc sign the app (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/DLPizer.app \
            && codesign --verify --verbose=1 dist/DLPizer.app \
            || echo "ad-hoc signing failed; the app still runs, just slower to start"

      - name: Smoke test the .app bundle (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          BIN=dist/DLPizer.app/Contents/MacOS/DLPizer
          [ -f "$BIN" ] || { echo "no .app bundle was produced"; exit 1; }
          "$BIN" --selftest

      # The runners ship a system ffmpeg, which masked a broken bundled one.
      # Strip PATH so this can only pass using the ffmpeg inside the app.
      - name: Smoke test with no system ffmpeg (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: env PATH=/nonexistent dist/DLPizer.app/Contents/MacOS/DLPizer --selftest

      - name: Report the minimum macOS the bundle requires
        if: runner.os == 'macOS'
        run: |
          BIN=dist/DLPizer.app/Contents/MacOS/DLPizer
          otool -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print "  binary minos:",$2; f=0}'
          PLIST=dist/DLPizer.app/Contents/Info.plist
          echo -n "  Info.plist claims: "
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$PLIST"

      - name: Verify every bundled binary matches the target (macOS)
        if: runner.os == 'macOS'
        run: |
          case "${{ matrix.name }}" in
            *arm64)  WANT=arm64 ;;
            *x86_64) WANT=x86_64 ;;
          esac
          BAD=0; N=0
          while IFS= read -r f; do
            ARCHS=$(lipo -archs "$f" 2>/dev/null) || continue
            N=$((N+1))
            case "$ARCHS" in
              *"$WANT"*) ;;
              *) echo "  wrong arch ($ARCHS): $f"; BAD=$((BAD+1)) ;;
            esac
          done < <(find dist/DLPizer.app -type f)
          echo "  checked $N Mach-O files against $WANT, $BAD mismatched"
          [ "$BAD" -eq 0 ]

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -d dist/DLPizer.app ]; then
            ditto -c -k --keepParent dist/DLPizer.app "${{ matrix.artifact }}"
          else
            ditto -c -k dist/DLPizer "${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  android:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy compiles the app's Python with a desktop Python of the same version.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the Android NDK
        run: |
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      # ffmpeg takes minutes per ABI; the script pins every source, so its
      # hash says exactly when the helpers need rebuilding. They are saved as
      # soon as they are built, so a later step failing doesn't throw them away.
      - name: Restore ffmpeg and QuickJS
        id: natives
        uses: actions/cache/restore@v4
        with:
          path: android/natives
          key: android-natives-${{ hashFiles('packaging/android/build_natives.sh') }}

      - name: Build ffmpeg and QuickJS for Android
        if: steps.natives.outputs.cache-hit != 'true'
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            packaging/android/build_natives.sh "$abi" "android/natives/$abi"
          done

      - name: Save ffmpeg and QuickJS
        if: steps.natives.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android/natives
          key: android-natives-${{ hashFiles('packaging/android/build_natives.sh') }}

      # The x86_64 helpers are static, so they run on the runner itself.
      # ffmpeg needs https to fetch just the part of a video asked for.
      - name: Smoke test the helpers
        run: |
          android/natives/x86_64/libffmpeg.so -hide_banner -encoders | grep -q libmp3lame
          android/natives/x86_64/libffmpeg.so -hide_banner -protocols | grep -qw https
          test "$(android/natives/x86_64/libqjs.so -e 'console.log(6 * 7)')" = 42

      # Android only installs an update signed with the same key as the app
      # already on the phone, so every release uses the key in the secrets.
      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing - add them under Settings > Secrets and variables > Actions to sign the Android app (see README)."
            exit 1
          fi
          # Pasting a 5,600-character secret can bring line breaks or spaces
          # along; base64 never contains either, so they are dropped.
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/ytgrab.keystore" \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 - paste the whole long line from the signing file again."; exit 1; }
          PW=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \t\r\n')
          # keytool says which half is wrong without ever echoing the password.
          if ! out=$(keytool -list -keystore "$RUNNER_TEMP/ytgrab.keystore" -storepass "$PW" -alias ytgrab 2>&1); then
            case "$out" in
              *"password was incorrect"*)
                why="ANDROID_KEYSTORE_PASSWORD is not the password for this key - set it to the short value on the first Secret: line of the signing file." ;;
              *EOFException*)
                why="ANDROID_KEYSTORE_BASE64 is cut short - paste the whole long block from the signing file again." ;;
              *)
                why="ANDROID_KEYSTORE_BASE64 does not hold the key from the signing file - paste the long block from it again." ;;
            esac
            echo "::error::$why"
            exit 1
          fi
          echo "YTGRAB_KEYSTORE=$RUNNER_TEMP/ytgrab.keystore" >> "$GITHUB_ENV"

      - name: Build the APKs
        working-directory: android
        env:
          YTGRAB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect and verify the APKs
        run: |
          mkdir apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for flavor in arm64 arm32 universal; do
            out="apk/DLPizer-android-$flavor.apk"
            cp "android/app/build/outputs/apk/$flavor/release/app-$flavor-release.apk" "$out"
            "$APKSIGNER" verify "$out"
            unzip -l "$out" | grep -q "lib/.*/libffmpeg.so" || { echo "$out has no ffmpeg"; exit 1; }
            unzip -l "$out" | grep -q "lib/.*/libqjs.so" || { echo "$out has no QuickJS"; exit 1; }
          done
          ls -l apk

      - uses: actions/upload-artifact@v4
        with:
          name: DLPizer-android
          path: apk/*.apk
          if-no-files-found: error

  release:
    needs: [version, build, android]
    if: ${{ always() && needs.version.outputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # A tag push releases itself; a manual run creates the tag it is given,
          # which is how a release gets cut without pushing a tag by hand.
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            Desktop builds of DLPizer (formerly ytgrab).

            macOS and Windows are unsigned, so the OS will warn on first launch:
            on macOS right-click the app and choose Open; on Windows choose
            "More info" then "Run anyway".

            Android 7.0+: most phones want DLPizer-android-arm64.apk, older
            32-bit phones DLPizer-android-arm32.apk; DLPizer-android-universal.apk
            runs on all of them. Open it on the phone and allow installing apps
            when asked.
