name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # lets you build from the Actions tab any time

permissions:
  contents: write      # needed to attach binaries to a release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional || false }}
    timeout-minutes: 40    # fail rather than queue forever if runners are scarce
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            artifact: ytgrab-linux-x86_64
          - os: windows-latest
            name: windows-x86_64
            artifact: ytgrab-windows-x86_64.exe
          - os: macos-latest
            name: macos-arm64
            artifact: ytgrab-macos-arm64.zip
            python-arch: arm64
          # Intel build runs on an Apple Silicon runner via Rosetta, because
          # the macos-13 Intel runners are being retired. Rosetta translates
          # x86_64 -> arm64, so an arm64 host can run the x64 toolchain.
          - os: macos-latest
            name: macos-x86_64
            artifact: ytgrab-macos-x86_64.zip
            python-arch: x64
            target-arch: x86_64
            optional: true      # never block a release on this leg

    steps:
      - uses: actions/checkout@v4

      # Rosetta lets the arm64 runner execute the x86_64 Python toolchain.
      - name: Ensure Rosetta (macOS Intel build)
        if: matrix.python-arch == 'x64' && runner.os == 'macOS'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch || 'x64' }}

      # PySide6 needs these shared libraries to even start headless on Linux.
      - name: Install Linux Qt runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        env:
          YTGRAB_TARGET_ARCH: ${{ matrix.target-arch || '' }}
        run: pyinstaller --noconfirm --clean ytgrab.spec

      # Prove the binary actually runs and found a working ffmpeg, rather than
      # just shipping whatever PyInstaller produced.
      - name: Smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/ytgrab --selftest

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\dist\ytgrab.exe --selftest

      - name: Package (Linux)
        if: matrix.name == 'linux-x86_64'
        run: mv dist/ytgrab "${{ matrix.artifact }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: mv dist/ytgrab.exe "${{ matrix.artifact }}"

      - name: Verify architecture (macOS)
        if: runner.os == 'macOS'
        run: |
          BIN=dist/ytgrab.app/Contents/MacOS/ytgrab
          [ -f "$BIN" ] || BIN=dist/ytgrab
          file "$BIN"
          lipo -archs "$BIN"
          EXPECT="${{ matrix.name }}"
          case "$EXPECT" in
            *arm64)   grep -q arm64  <<<"$(lipo -archs "$BIN")" || { echo "expected arm64"; exit 1; } ;;
            *x86_64)  grep -q x86_64 <<<"$(lipo -archs "$BIN")" || { echo "expected x86_64"; exit 1; } ;;
          esac

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -d dist/ytgrab.app ]; then
            ditto -c -k --keepParent dist/ytgrab.app "${{ matrix.artifact }}"
          else
            ditto -c -k dist/ytgrab "${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Desktop builds of ytgrab.

            macOS and Windows are unsigned, so the OS will warn on first launch:
            on macOS right-click the app and choose Open; on Windows choose
            "More info" then "Run anyway".
